org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 8.11.1's max officially supported compileSdk is 36; the host compiles
# against 37 for the Legado engine AARs (see app/build.gradle.kts). Silence
