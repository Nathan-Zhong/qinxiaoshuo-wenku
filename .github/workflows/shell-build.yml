name: shell-build

on:
  workflow_dispatch:
  push:
    branches: [official-base]
    paths:
      - '.github/workflows/shell-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: flutter version
        run: flutter --version

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "ANALYZE_EXIT=$?"
          echo "ERROR_COUNT=$(grep -c 'error •' analyze.txt)"
          grep 'error •' analyze.txt | head -80
          exit 0

      - name: restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.XIAOSHUO_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.XIAOSHUO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XIAOSHUO_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.XIAOSHUO_STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then echo "missing signing secrets"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF
          ls -l "$RUNNER_TEMP/release.jks"

      - name: build release apk
        run: flutter build apk --release --target-platform android-arm64

      - name: verify apk
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | head -5
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          unzip -l "$APK" | grep -E 'libcpp|libapp|libflutter' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-analyze
          path: analyze.txt
          if-no-files-found: ignore
